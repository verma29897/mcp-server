name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # Pinned, not floating. Most of what a vulnerability scan reports against a
  # server like this one is in the standard library, so the toolchain version
  # is part of the security posture rather than an incidental build detail.
  GO_VERSION: '1.26.6'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download
          # A tidy diff means go.mod and the imports have drifted apart, which
          # is how an unreviewed dependency arrives.
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test under the race detector
        run: go test -race -count=1 ./...

      - name: Coverage
        run: |
          go test -coverpkg=./internal/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # A short run on every change, so a newly reachable panic is caught at
      # the pull request rather than in the nightly job.
      - name: Fuzz each target briefly
        run: |
          for target in FuzzCustomerID FuzzResourceURI FuzzSearchInput FuzzCursor FuzzNotificationInput FuzzScopeParsing; do
            echo "--- $target"
            go test -run '^$' -fuzz "^$target$" -fuzztime 30s ./tests/fuzz/
          done

      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: tests/fuzz/testdata/

  container:
    name: Container build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: company-mcp-server:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          provenance: false

      - name: Scan image
        # v0.36.0, pinned by commit to prevent a mutable tag from changing
        # the code executed inside this security-sensitive job.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: company-mcp-server:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Generate SBOM
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: company-mcp-server:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
