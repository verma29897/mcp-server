name: Nightly fuzz

# The pull-request job runs each target for 30 seconds, which catches a
# newly reachable panic. Finding the inputs that take minutes to reach needs
# minutes, and that belongs on a schedule rather than in a developer's wait.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzCustomerID
          - FuzzResourceURI
          - FuzzSearchInput
          - FuzzCursor
          - FuzzNotificationInput
          - FuzzScopeParsing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Fuzz ${{ matrix.target }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 20m ./tests/fuzz/

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashers-${{ matrix.target }}
          path: tests/fuzz/testdata/
